<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - Brew & Bean</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f5f0;
            color: #2f241f;
        }

        header {
            background: #3e2723;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .enquiry {
            max-width: 600px;
            margin: 70px auto;
            padding: 20px;
        }

        .enquiry h2 {
            text-align: center;
            font-size: 40px;
            margin-bottom: 15px;
        }

        .enquiry > p {
            text-align: center;
            color: #5d4a43;
            margin-bottom: 35px;
        }

        form {
            background: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #6d4c41;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4e342e;
        }

        footer {
            background: #3e2723;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 60px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 8px;
            }

            .enquiry h2 {
                font-size: 32px;
            }

            form {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>☕ Brew & Bean</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="enquiry.html">Enquiry</a>
        </nav>
    </header>

    <main>
        <section class="enquiry">
            <h2>Enquiry</h2>

            <p>
                Have a question or want to know more? Send us a message.
            </p>

            <form>
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="subject">Enquiry Type</label>
                <select id="subject" name="subject">
                    <option value="general">General Enquiry</option>
                    <option value="menu">Menu Information</option>
                    <option value="booking">Table Booking</option>
                    <option value="feedback">Feedback</option>
                </select>

                <label for="message">Message</label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your enquiry here..."
                    required
                ></textarea>

                <button type="submit">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Brew & Bean. All rights reserved.</p>
    </footer>

</body>
</html>
